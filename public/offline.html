<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: Canvas; color: CanvasText; padding: 24px; box-sizing: border-box; }
  main { max-width: 22rem; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { opacity: .7; line-height: 1.5; margin: 0 0 1.5rem; }
  button { font: inherit; font-weight: 600; padding: .75rem 1.5rem; border-radius: .75rem; border: 0; background: CanvasText; color: Canvas; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Você está sem conexão</h1>
  <p>Confira o Wi-Fi ou os dados móveis. Seu carrinho continua salvo neste aparelho, e nenhum pedido foi enviado enquanto você estava offline.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>

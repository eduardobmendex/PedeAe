name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rápido e sem banco: lint, tipos e testes de unidade.
  checks:
    name: Lint, tipos e unidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  # Banco e fluxo completo contra um Supabase local (Docker do runner), nunca contra produção.
  integration:
    name: Banco e ponta a ponta
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Subir Supabase local (aplica todas as migrations)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Variáveis do Supabase local
        run: |
          npx supabase status -o env > supabase.env
          set -a; source supabase.env; set +a
          {
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
          } >> "$GITHUB_ENV"

      - name: Testes de banco (RLS, permissões, pedidos, relatórios)
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
